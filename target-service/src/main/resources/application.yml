spring:
  application:
    name: target-service
  datasource:
    url: jdbc:postgresql://localhost:5433/urlshortener
    username: urlshortener
    password: urlshortener
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  base-url: http://localhost:8080
